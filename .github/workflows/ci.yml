name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source-ref:
        description: Validated immutable release SHA; empty keeps normal event CI
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  GOTOOLCHAIN: local
  GOWORK: "off"
  GOTELEMETRY: "off"
  GOFLAGS: -mod=readonly

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        go: ["1.25"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Set up Python validation deps (venv; PEP 668-safe)
        run: |
          python3 -m venv "$RUNNER_TEMP/beme-venv"
          "$RUNNER_TEMP/beme-venv/bin/pip" install --quiet jsonschema pyyaml
          echo "$RUNNER_TEMP/beme-venv/bin" >> "$GITHUB_PATH"
      - name: Validate contract fixtures (public only)
        run: make validate
      - name: CI regression suite (synthetic public/private separation)
        run: python3 scripts/test_ci_regression.py
      - name: Documentation consistency suite
        run: python3 scripts/test_docs_consistency.py
      - name: Release workflow source-binding regressions
        run: python3 scripts/test_release_workflow.py -v
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Threat corpus runner (shared registry, synthetic data)
        run: go run ./cmd/beme-threat-corpus --repo .

  # Full native Windows suite, not a filtered or short brain subset.
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Keep fixtures byte-exact (no CRLF conversion)
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Build, vet, full tests and synthetic threat corpus
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./scripts/native.ps1
          Invoke-CheckedNative -Command go -Arguments @('build', './...')
          Invoke-CheckedNative -Command go -Arguments @('vet', './...')
          Invoke-CheckedNative -Command go -Arguments @('test', './...')
          Invoke-CheckedNative -Command go -Arguments @('run', './cmd/beme-threat-corpus', '--repo', '.')

  # Exercise every release target before tagging, outside the checkout.
  # All data is synthetic; evaluator help does not execute a model/provider.
  installed-binary-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15-intel, target: darwin_amd64}
          - {os: macos-15, target: darwin_arm64}
          - {os: ubuntu-24.04, target: linux_amd64}
          - {os: ubuntu-24.04-arm, target: linux_arm64}
          - {os: windows-latest, target: windows_amd64}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Keep fixtures byte-exact (no CRLF conversion)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Source install, negative controls and native artifact smoke
        if: runner.os != 'Windows'
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/beme-installed-bin
          BEME_SMOKE_BIN_DIR: ${{ runner.temp }}/beme-installed-bin
          ARTIFACT_DIR: ${{ runner.temp }}/beme-pr-artifacts
        run: |
          set -euo pipefail
          go install ./cmd/beme ./cmd/beme-bench ./cmd/beme-threat-corpus ./cmd/beme-eval
          python scripts/test_smoke.py -v
          python scripts/test_release.py -v
          python scripts/release.py package --target "$TARGET" --out "$ARTIFACT_DIR" --smoke
      - name: Windows fail-then-success control, source and archive smoke
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOBIN: ${{ runner.temp }}/beme-installed-bin
          BEME_SMOKE_BIN_DIR: ${{ runner.temp }}/beme-installed-bin
          ARTIFACT_DIR: ${{ runner.temp }}/beme-pr-artifacts
        run: |
          $ErrorActionPreference = "Stop"
          . ./scripts/native.ps1
          Invoke-CheckedNative -Command go -Arguments @('install', './cmd/beme', './cmd/beme-bench', './cmd/beme-threat-corpus', './cmd/beme-eval')
          Invoke-CheckedNative -Command python -Arguments @('scripts/test_smoke.py', '-v')
          Invoke-CheckedNative -Command python -Arguments @('scripts/test_release.py', '-v')
          Invoke-CheckedNative -Command python -Arguments @('scripts/release.py', 'package', '--target', $env:TARGET, '--out', $env:ARTIFACT_DIR, '--smoke')
      # No upload/publish in public CI: PRs execute the same packaging helpers.

  private-data-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Scan for private data leakage
        run: python3 scripts/scan_private_data.py
